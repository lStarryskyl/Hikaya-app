name: Demo browser journey

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hikaya
          POSTGRES_PASSWORD: hikaya
          POSTGRES_DB: hikaya_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikaya -d hikaya_e2e"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql+asyncpg://hikaya:hikaya@127.0.0.1:5432/hikaya_e2e
      LIVE_AI_ENABLED: "false"
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: Install API dependencies
        run: pip install -r api/requirements-dev.txt
      - name: Install media tooling
        run: |
          if ! command -v ffmpeg >/dev/null; then
            sudo apt-get update -q
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
      - name: Install frontend and browser
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the demo browser journey
        working-directory: web
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e 2>&1 | tee e2e-server.log
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-failure
          path: |
            web/playwright-report/
            web/test-results/
            web/e2e-server.log
          retention-days: 14
