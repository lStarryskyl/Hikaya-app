name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hikaya
          POSTGRES_PASSWORD: hikaya
          POSTGRES_DB: hikaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikaya -d hikaya_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hikaya:hikaya@localhost:5432/hikaya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API health, directly and through the web proxy
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:5173/api/v1/health
      - name: The worker runs a job
        run: |
          docker compose exec -T db psql -U hikaya -d hikaya -c "INSERT INTO jobs (kind, payload) VALUES ('ping', '{\"echo\": \"ci\"}');"
          for i in $(seq 1 20); do
            status=$(docker compose exec -T db psql -U hikaya -d hikaya -Atc "SELECT status FROM jobs ORDER BY created_at DESC LIMIT 1;")
            echo "job status: $status"
            [ "$status" = "done" ] && exit 0
            sleep 1
          done
          exit 1
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop the stack
        if: always()
        run: docker compose down -v
