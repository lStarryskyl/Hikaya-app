name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: hikaya
          POSTGRES_PASSWORD: hikaya
          POSTGRES_DB: hikaya_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hikaya -d hikaya_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://hikaya:hikaya@localhost:5432/hikaya_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-dev.txt
      - name: FFmpeg (audio upload tests convert real recordings)
        # A slow package mirror must fail fast instead of holding the run for an hour.
        timeout-minutes: 8
        run: |
          which ffmpeg && exit 0
          for attempt in 1 2 3; do
            sudo timeout 150 apt-get -o Acquire::Retries=3 update -q \
              && sudo timeout 240 apt-get -o Acquire::Retries=3 install -y -q --no-install-recommends ffmpeg \
              && exit 0
            echo "apt attempt $attempt failed; retrying"
            sleep 10
          done
          exit 1
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Settings for the test run (throwaway staff passwords, CI only)
        run: |
          {
            echo "SEED_ADMIN_EMAIL=admin@example.com"
            echo "SEED_ADMIN_PASSWORD=ci-only-admin-password"
            echo "SEED_REVIEWER_EMAIL=reviewer@example.com"
            echo "SEED_REVIEWER_PASSWORD=ci-only-reviewer-password"
          } > .env
      - name: Start the stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: API health, directly and through the web proxy
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:5173/api/v1/health
      - name: The worker runs a job
        run: |
          docker compose exec -T db psql -U hikaya -d hikaya -c "INSERT INTO jobs (kind, payload) VALUES ('ping', '{\"echo\": \"ci\"}');"
          for i in $(seq 1 20); do
            status=$(docker compose exec -T db psql -U hikaya -d hikaya -Atc "SELECT status FROM jobs ORDER BY created_at DESC LIMIT 1;")
            echo "job status: $status"
            [ "$status" = "done" ] && exit 0
            sleep 1
          done
          exit 1
      - name: The demo stories and photos are loaded
        run: |
          set -e
          base=http://localhost:5173
          test "$(curl -fsS "$base/api/v1/stories?limit=50" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["items"]))')" = 7
          test "$(curl -fsS $base/api/v1/map/pins | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = 7
          photo=$(curl -fsS $base/api/v1/places | python3 -c 'import json,sys; print(json.load(sys.stdin)[0]["cover"]["urls"]["480"])')
          curl -fsS -o /tmp/photo.webp -w '%{content_type}\n' "$base$photo" | grep -q image/webp
      - name: Sign-up, sign-in, roles and sign-out work through the web proxy
        run: |
          set -e
          base=http://localhost:5173/api/v1
          json='Content-Type: application/json'
          # staff seeded at start-up can sign in
          curl -fsS -c admin.jar -H "$json" -d '{"email":"admin@example.com","password":"ci-only-admin-password"}' $base/auth/login
          curl -fsS -b admin.jar $base/auth/me | grep -q '"role":"admin"'
          curl -fsS -c reviewer.jar -H "$json" -d '{"email":"reviewer@example.com","password":"ci-only-reviewer-password"}' $base/auth/login
          curl -fsS -b reviewer.jar $base/auth/me | grep -q '"role":"reviewer"'
          # a new member signs up and gets the member role, whatever they send
          curl -fsS -c member.jar -H "$json" -d '{"email":"member@example.com","password":"ci-member-password","display_name":"CI Member","role":"admin"}' $base/auth/signup | grep -q '"role":"member"'
          curl -fsS -b member.jar $base/auth/me | grep -q '"display_name":"CI Member"'
          # a wrong password is refused, and signed-out visitors are not "me"
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "$json" -d '{"email":"member@example.com","password":"wrong"}' $base/auth/login)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' $base/auth/me)" = 401
          # sign-out ends the session
          test "$(curl -s -o /dev/null -w '%{http_code}' -b member.jar -X POST $base/auth/logout)" = 204
          test "$(curl -s -o /dev/null -w '%{http_code}' -b member.jar $base/auth/me)" = 401
      - name: Logs on failure
        if: failure()
        run: |
          docker compose logs
          # Also as an annotation, readable through the API when log downloads are blocked.
          tail=$(docker compose logs --no-color --tail=40 api worker 2>&1 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=compose logs (api, worker)::$tail"
      - name: Stop the stack
        if: always()
        run: docker compose down -v
